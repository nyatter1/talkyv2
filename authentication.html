<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Talky V2 - Authentication</title>
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0b0c10">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Talky">
    <link rel="icon" type="image/png" href="/pwa-192x192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0b0c10;
            color: #f2f3f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(255, 255, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.05) 0px, transparent 50%);
            padding: 2rem 1rem;
        }

        .auth-card {
            background: rgba(30, 31, 36, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 100%;
            max-width: 480px;
            padding: 2.5rem;
            position: relative;
        }

        .back-link {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            color: #949ba4;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .back-link svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .auth-header {
            text-align: center;
            margin-top: 1rem;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.4rem;
        }

        .auth-header p {
            font-size: 0.95rem;
            color: #949ba4;
        }

        .form-group {
            margin-bottom: 1.4rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #b5bac1;
            margin-bottom: 0.5rem;
        }

        label .required {
            color: #f23f43;
            margin-left: 2px;
        }

        .glass-input {
            width: 100%;
            background: rgba(18, 19, 23, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 0.8rem 1rem;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .glass-input:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(18, 19, 23, 0.95);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
        }

        .dob-group {
            display: flex;
            gap: 0.75rem;
            width: 100%;
        }

        .custom-dropdown {
            position: relative;
            flex: 1;
        }

        .dropdown-select {
            width: 100%;
            background: rgba(18, 19, 23, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 0.8rem 1rem;
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .dropdown-select svg {
            width: 12px;
            height: 12px;
            fill: #949ba4;
        }

        .dropdown-select:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(18, 19, 23, 0.95);
        }

        .dropdown-content {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            min-width: 180px;
            width: 100%;
            background: rgba(18, 19, 26, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
            display: none;
            flex-direction: column;
            z-index: 50;
            padding: 0.5rem 0;
        }

        .dropdown-content.open {
            display: flex;
        }

        .dropdown-search {
            width: calc(100% - 1rem);
            margin: 0.25rem 0.5rem 0.5rem 0.5rem;
            padding: 0.55rem 0.75rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 0.85rem;
        }

        .dropdown-items-container {
            max-height: 180px;
            overflow-y: auto;
        }

        .dropdown-items-container::-webkit-scrollbar {
            width: 6px;
        }
        .dropdown-items-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .dropdown-item {
            padding: 0.65rem 1rem;
            cursor: pointer;
            font-size: 0.9rem;
            color: #b5bac1;
            transition: background 0.15s, color 0.15s;
        }

        .dropdown-item:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #949ba4;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .checkbox-container input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #ffffff;
            cursor: pointer;
        }

        .glass-submit-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 0.85rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .glass-submit-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .auth-footer {
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: #949ba4;
        }

        .auth-footer button {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0;
            margin-left: 4px;
            text-decoration: underline;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        @media (max-width: 1080px) and (min-width: 521px) {
            .auth-card {
                max-width: 440px;
                padding: 2rem;
            }
            .auth-header h2 {
                font-size: 1.45rem;
            }
            .glass-input, .dropdown-select {
                padding: 0.7rem 0.85rem;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 520px) {
            .dob-group {
                flex-direction: column;
            }
            .dropdown-content {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="back-link">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Home
        </a>

        <!-- Login View -->
        <div class="form-panel active" id="loginPanel">
            <div class="auth-header">
                <h2>Welcome back!</h2>
                <p>We're so excited to see you again!</p>
            </div>
            <div id="loginError" style="display: none; background: rgba(242, 63, 67, 0.15); border: 1px solid rgba(242, 63, 67, 0.45); color: #f23f43; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; margin-bottom: 14px; text-align: left;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Email or Username <span class="required">*</span></label>
                    <input type="text" class="glass-input" id="loginIdentifier" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" class="glass-input" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="glass-submit-btn">Log In</button>
                <div class="auth-footer">
                    Need an account? <button type="button" onclick="switchTab('signup')">Register</button>
                </div>
            </form>
        </div>

        <!-- Signup View -->
        <div class="form-panel" id="signupPanel">
            <div class="auth-header">
                <h2>Create an account</h2>
            </div>
            <div id="signupError" style="display: none; background: rgba(242, 63, 67, 0.15); border: 1px solid rgba(242, 63, 67, 0.45); color: #f23f43; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; margin-bottom: 14px; text-align: left;"></div>
            <form id="signupForm">
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" class="glass-input" id="signupEmail" required autocomplete="email" placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label>Display Name <span class="required">*</span> <span style="font-size: 0.72rem; color: #949ba4; font-weight: normal; text-transform: none;">(Min 3 chars, max 1 space, only letters, numbers, _ and .)</span></label>
                    <input type="text" class="glass-input" id="signupUsername" required autocomplete="username" placeholder="e.g. Alex_Miller">
                </div>
                <div class="form-group">
                    <label>User Handle <span class="required">*</span> <span style="font-size: 0.72rem; color: #949ba4; font-weight: normal; text-transform: none;">(3–12 chars, no spaces, only letters, numbers, _ and .)</span></label>
                    <input type="text" class="glass-input" id="signupHandle" required placeholder="e.g. alex.m" maxlength="12">
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" class="glass-input" id="signupPassword" required autocomplete="new-password">
                </div>
                
                <div class="form-group">
                    <label>Date of Birth <span class="required">*</span></label>
                    <div class="dob-group">
                        <div class="custom-dropdown" id="monthDropdown">
                            <div class="dropdown-select" onclick="toggleDropdown('monthDropdown')">
                                <span class="selected-val">Month</span>
                                <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                            </div>
                            <div class="dropdown-content">
                                <input type="text" class="dropdown-search" placeholder="Search month..." oninput="filterDropdown(this, 'monthDropdown')">
                                <div class="dropdown-items-container">
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'January')">January</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'February')">February</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'March')">March</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'April')">April</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'May')">May</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'June')">June</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'July')">July</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'August')">August</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'September')">September</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'October')">October</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'November')">November</div>
                                    <div class="dropdown-item" onclick="selectOption('monthDropdown', 'December')">December</div>
                                </div>
                            </div>
                        </div>

                        <div class="custom-dropdown" id="dayDropdown">
                            <div class="dropdown-select" onclick="toggleDropdown('dayDropdown')">
                                <span class="selected-val">Day</span>
                                <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                            </div>
                            <div class="dropdown-content">
                                <input type="text" class="dropdown-search" placeholder="Search day..." oninput="filterDropdown(this, 'dayDropdown')">
                                <div class="dropdown-items-container" id="dayItems"></div>
                            </div>
                        </div>

                        <div class="custom-dropdown" id="yearDropdown">
                            <div class="dropdown-select" onclick="toggleDropdown('yearDropdown')">
                                <span class="selected-val">Year</span>
                                <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
                            </div>
                            <div class="dropdown-content">
                                <input type="text" class="dropdown-search" placeholder="Search year..." oninput="filterDropdown(this, 'yearDropdown')">
                                <div class="dropdown-items-container" id="yearItems"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="checkbox-container">
                    <input type="checkbox" id="termsCheck" required>
                    <label for="termsCheck" style="text-transform:none; font-weight:normal; margin:0; cursor:pointer;">I have read and agree to Talky's Terms of Service and Privacy Policy.</label>
                </div>

                <button type="submit" class="glass-submit-btn">Continue</button>
                <div class="auth-footer">
                    Already have an account? <button type="button" onclick="switchTab('login')">Log In</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { rtdb, ref, set, get, child } from './firebase.ts';

        // Auto-login check: verify against Firebase RTDB so deleted users are never auto-logged in
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            localStorage.removeItem('talky_current_user');
        } else {
            const currentUserRaw = localStorage.getItem('talky_current_user');
            if (currentUserRaw) {
                try {
                    const parsedUser = JSON.parse(currentUserRaw);
                    if (parsedUser && parsedUser.id) {
                        get(ref(rtdb, 'users/' + parsedUser.id)).then(snap => {
                            if (snap.exists() && snap.val()) {
                                window.location.href = 'app.html';
                            } else {
                                console.warn('[Talky Auth] Saved user no longer exists in Realtime Database. Cleared session.');
                                localStorage.removeItem('talky_current_user');
                            }
                        }).catch(() => {
                            window.location.href = 'app.html';
                        });
                    } else {
                        localStorage.removeItem('talky_current_user');
                    }
                } catch(e) {
                    localStorage.removeItem('talky_current_user');
                }
            }
        }

        const initialMode = urlParams.get('mode');
        if (initialMode === 'signup' || initialMode === 'register') {
            setTimeout(() => switchTab('signup'), 10);
        } else if (initialMode === 'login') {
            setTimeout(() => switchTab('login'), 10);
        }

        // Helper to query all users: Firebase RTDB is the single source of truth.
        // If a user was deleted from Realtime Database, they do NOT exist.
        async function getAllRegisteredUsers() {
            try {
                const snap = await get(ref(rtdb, 'users'));
                if (snap.exists() && snap.val()) {
                    const fbUsers = snap.val();
                    const validUsers = Object.values(fbUsers).filter(Boolean);
                    // Sync localStorage talky_users to only match existing database users
                    localStorage.setItem('talky_users', JSON.stringify(validUsers));
                    return validUsers;
                } else {
                    // All users were deleted from Realtime Database!
                    localStorage.setItem('talky_users', '[]');
                    return [];
                }
            } catch (fbErr) {
                console.warn('Could not query Firebase users:', fbErr);
                try {
                    return JSON.parse(localStorage.getItem('talky_users') || '[]');
                } catch(e) {
                    return [];
                }
            }
        }

        function switchTab(tab) {
            const loginPanel = document.getElementById('loginPanel');
            const signupPanel = document.getElementById('signupPanel');
            const loginError = document.getElementById('loginError');
            const signupError = document.getElementById('signupError');
            if (loginError) loginError.style.display = 'none';
            if (signupError) signupError.style.display = 'none';

            if (tab === 'login') {
                loginPanel.classList.add('active');
                signupPanel.classList.remove('active');
            } else {
                signupPanel.classList.add('active');
                loginPanel.classList.remove('active');
            }
        }

        const dayContainer = document.getElementById('dayItems');
        for (let i = 1; i <= 31; i++) {
            dayContainer.innerHTML += `<div class="dropdown-item" onclick="selectOption('dayDropdown', '${i}')">${i}</div>`;
        }

        const yearContainer = document.getElementById('yearItems');
        for (let i = 2026; i >= 1950; i--) {
            yearContainer.innerHTML += `<div class="dropdown-item" onclick="selectOption('yearDropdown', '${i}')">${i}</div>`;
        }

        function toggleDropdown(dropdownId) {
            document.querySelectorAll('.dropdown-content').forEach(el => {
                if(el.closest('.custom-dropdown').id !== dropdownId) {
                    el.classList.remove('open');
                }
            });
            const dropdown = document.getElementById(dropdownId).querySelector('.dropdown-content');
            dropdown.classList.toggle('open');
        }

        function selectOption(dropdownId, value) {
            const dropdown = document.getElementById(dropdownId);
            dropdown.querySelector('.selected-val').textContent = value;
            dropdown.querySelector('.dropdown-content').classList.remove('open');
        }

        function filterDropdown(input, dropdownId) {
            const filter = input.value.toLowerCase();
            const items = document.getElementById(dropdownId).querySelectorAll('.dropdown-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(filter) ? 'block' : 'none';
            });
        }

        // Expose to window for inline HTML onclick attributes
        window.switchTab = switchTab;
        window.toggleDropdown = toggleDropdown;
        window.selectOption = selectOption;
        window.filterDropdown = filterDropdown;

        window.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-dropdown')) {
                document.querySelectorAll('.dropdown-content').forEach(el => el.classList.remove('open'));
            }
        });

        // Auto-sync handle suggestion from display name if not edited
        const signupUsernameInput = document.getElementById('signupUsername');
        const signupHandleInput = document.getElementById('signupHandle');
        let userEditedHandleManually = false;

        if (signupHandleInput) {
            signupHandleInput.addEventListener('input', () => {
                userEditedHandleManually = true;
            });
        }
        if (signupUsernameInput && signupHandleInput) {
            signupUsernameInput.addEventListener('input', () => {
                if (!userEditedHandleManually) {
                    const clean = signupUsernameInput.value.toLowerCase().replace(/ /g, '_').replace(/[^a-z0-9_.]/g, '').slice(0, 12);
                    signupHandleInput.value = clean;
                }
            });
        }

        // Form Submission Handlers
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('signupError');
            if (errorEl) errorEl.style.display = 'none';

            const email = document.getElementById('signupEmail').value.trim();
            const displayName = document.getElementById('signupUsername').value.trim();
            const handleEl = document.getElementById('signupHandle');
            const rawHandle = (handleEl ? handleEl.value : displayName).trim().replace(/^@/, '');
            const password = document.getElementById('signupPassword').value;

            if (!email || !displayName || !rawHandle || !password) {
                if (errorEl) {
                    errorEl.textContent = 'Please fill in all required fields.';
                    errorEl.style.display = 'block';
                }
                return;
            }

            // --- 1. DISPLAY NAME VALIDATION ---
            // Must be at least 3 letters
            if (displayName.length < 3) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ Display name must be at least 3 characters long.';
                    errorEl.style.display = 'block';
                }
                document.getElementById('signupUsername').focus();
                return;
            }

            // Max 1 space allowed
            const spaceCount = (displayName.match(/ /g) || []).length;
            if (spaceCount > 1) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ Display name can contain at most 1 space.';
                    errorEl.style.display = 'block';
                }
                document.getElementById('signupUsername').focus();
                return;
            }

            // Only letters, numbers, underscores (_), dots (.), and spaces allowed (no special characters!)
            if (!/^[a-zA-Z0-9_. ]+$/.test(displayName)) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ Display name can only contain letters, numbers, underscores (_), dots (.), and up to 1 space. No special characters allowed.';
                    errorEl.style.display = 'block';
                }
                document.getElementById('signupUsername').focus();
                return;
            }

            // --- 2. HANDLE VALIDATION ---
            // No spaces allowed in handle
            if (rawHandle.includes(' ')) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ Handle cannot contain spaces.';
                    errorEl.style.display = 'block';
                }
                if (handleEl) handleEl.focus();
                return;
            }

            // Length must be between 3 and 12 characters (min 3, max 12)
            if (rawHandle.length < 3 || rawHandle.length > 12) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ Handle must be between 3 and 12 characters long.';
                    errorEl.style.display = 'block';
                }
                if (handleEl) handleEl.focus();
                return;
            }

            // Only letters, numbers, underscores (_), and dots (.) allowed in handle
            if (!/^[a-zA-Z0-9_.]+$/.test(rawHandle)) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ Handle can only contain letters, numbers, underscores (_), and dots (.). No spaces or special characters.';
                    errorEl.style.display = 'block';
                }
                if (handleEl) handleEl.focus();
                return;
            }

            const cleanHandle = rawHandle.toLowerCase();
            const lowerEmail = email.toLowerCase();
            const lowerDisplayName = displayName.toLowerCase();

            // Check existing registered users
            const existingUsers = await getAllRegisteredUsers();

            // 1. Check if email is already taken
            const emailTaken = existingUsers.some(u => u.email && u.email.toLowerCase() === lowerEmail);
            if (emailTaken) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ An account with this email address is already registered. Please log in.';
                    errorEl.style.display = 'block';
                }
                document.getElementById('signupEmail').focus();
                return;
            }

            // 2. Check if handle is already taken
            const handleTaken = existingUsers.some(u => 
                (u.handle && u.handle.toLowerCase() === cleanHandle) || 
                (u.username && u.username.toLowerCase() === cleanHandle)
            );
            if (handleTaken) {
                if (errorEl) {
                    errorEl.textContent = `⚠️ The handle "@${cleanHandle}" is already taken by another account. Please choose another handle.`;
                    errorEl.style.display = 'block';
                }
                if (handleEl) handleEl.focus();
                return;
            }

            const userObj = {
                id: 'user_' + Date.now(),
                email: email,
                username: displayName,
                displayName: displayName,
                handle: cleanHandle,
                password: password,
                handleLastChanged: null,
                pronouns: '',
                bio: '',
                links: [],
                avatar: '',
                banner: '',
                accentColor: '#ffffff',
                secondaryColor: '#2b2d31',
                borderStartColor: '#ffffff',
                borderEndColor: '#80848e',
                createdAt: Date.now()
            };

            try {
                let users = JSON.parse(localStorage.getItem('talky_users') || '[]');
                users.push(userObj);
                localStorage.setItem('talky_users', JSON.stringify(users));
                localStorage.setItem('talky_current_user', JSON.stringify(userObj));
            } catch (err) {
                console.warn('Quota warning in signup, trying current_user only:', err);
                try { localStorage.setItem('talky_current_user', JSON.stringify(userObj)); } catch(e) {}
            }

            // Sync user account directly to Firebase Realtime Database
            try {
                await set(ref(rtdb, 'users/' + userObj.id), userObj);
            } catch (fbErr) {
                console.warn('Firebase RTDB user signup sync error:', fbErr);
            }

            window.location.href = 'app.html';
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('loginError');
            if (errorEl) errorEl.style.display = 'none';

            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!identifier || !password) {
                if (errorEl) {
                    errorEl.textContent = 'Please enter both your email/username and password.';
                    errorEl.style.display = 'block';
                }
                return;
            }

            const lowerId = identifier.toLowerCase();
            const existingUsers = await getAllRegisteredUsers();

            // Match by email, username, or handle
            const match = existingUsers.find(u => 
                (u.email && u.email.toLowerCase() === lowerId) || 
                (u.username && u.username.toLowerCase() === lowerId) || 
                (u.handle && u.handle.toLowerCase() === lowerId)
            );

            // 1. If username / email does not exist: block login!
            if (!match) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ Incorrect email/username or password.';
                    errorEl.style.display = 'block';
                }
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginIdentifier').focus();
                return;
            }

            // 2. Strict password verification: block login if password does not match!
            if (!match.password || match.password !== password) {
                if (errorEl) {
                    errorEl.textContent = '⚠️ Incorrect email/username or password.';
                    errorEl.style.display = 'block';
                }
                document.getElementById('loginPassword').value = '';
                document.getElementById('loginPassword').focus();
                return;
            }

            // Save in localStorage and Firebase RTDB
            try {
                let users = JSON.parse(localStorage.getItem('talky_users') || '[]');
                const idx = users.findIndex(u => u.id === match.id);
                if (idx >= 0) {
                    users[idx] = match;
                } else {
                    users.push(match);
                }
                localStorage.setItem('talky_users', JSON.stringify(users));
                localStorage.setItem('talky_current_user', JSON.stringify(match));
            } catch (err) {
                console.warn('Quota error in login:', err);
                try { localStorage.setItem('talky_current_user', JSON.stringify(match)); } catch(e) {}
            }

            // Sync to Firebase RTDB
            try {
                await set(ref(rtdb, 'users/' + match.id), match);
            } catch (e) {}

            window.location.href = 'app.html';
        });

        // Disable right clicking globally
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });
    </script>
</body>
</html>
